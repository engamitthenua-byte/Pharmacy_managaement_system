# Database Configuration for Pharmacy Management System
# -------------------------------------------------------
# IMPORTANT: Keep this file outside the web-accessible directory.
# Do NOT commit real credentials to version control.
# Copy this file and name it application.properties (already correct),
# then fill in your local MySQL credentials below.

# MySQL Database Connection
db.url=jdbc:mysql://localhost:3306/pharmacy_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.username=root
db.password=admin
db.driver=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxTotal=20
db.pool.maxIdle=10
db.pool.minIdle=5
db.pool.maxWaitMillis=30000

# Application Settings
app.name=Pharmacy Management System
app.version=1.0.0
app.session.timeout=1800

# Tax configuration (set to 0 to disable tax)
app.tax.rate=0

# Low stock threshold (default fallback, overridden per-medicine)
app.lowstock.threshold=10

# Near-expiry warning days (medicines expiring within this many days)
app.expiry.warning.days=30
